<style>
:root{--bg:#1a1a1d;--card:#2a2a2f;--c2:#222226;--bd:#3d3d45;--tx:#f1f1f1;--mut:#a9a9b3;--or:#ff9f1c;--orbg:#4d3b25;--ok:#2ecc71;--bad:#ff5c5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:860px;margin:0 auto;padding:8px 12px 110px}
button{font:inherit;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{flex:1 0 auto;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--c2);font-weight:600;white-space:nowrap}
.tab.on{background:var(--orbg);border-color:var(--or);color:var(--or)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0}
.box h3{margin:0 0 10px;font-size:19px}.box h3 small{color:var(--mut);font-weight:500;font-size:13px}
.mut{color:var(--mut);font-size:14px}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);color:var(--tx);font:inherit}
.inp.sm{width:90px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mode{padding:12px 8px;border-radius:14px;border:1px solid var(--bd);background:var(--c2);font-weight:700}
.mode small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.mode.on{background:var(--orbg);border-color:var(--or)}.mode.on b,.mode.on{color:var(--or)}
.row{display:flex;align-items:center;gap:12px;padding:13px 12px;margin:8px 0;border-radius:14px;border:1px solid var(--bd);background:var(--c2);cursor:pointer}
.row.on{background:var(--orbg);border-color:var(--or)}.row span{flex:1}.row em{font-style:normal;color:var(--mut);font-size:14px;white-space:nowrap}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--or);flex:none}
.deh{display:flex;justify-content:space-between;align-items:center;margin:14px 0 2px;color:var(--or)}
.mini{padding:9px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);font-size:14px}
.mini.on{background:var(--orbg);border-color:var(--or);color:var(--or)}.mini.danger{color:var(--bad)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.big{width:100%;padding:16px;border:0;border-radius:18px;background:var(--or);color:#2a1a00;font-weight:800;font-size:19px}
.big.alt{background:var(--c2);color:var(--or);border:1px solid var(--or)}
.big.resume{background:#ffd166;margin-bottom:6px;animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px rgba(255,159,28,.3)}}
.qtop{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;font-weight:700;position:sticky;top:0;background:var(--bg);z-index:5}
.stat{color:var(--or)}.tm{font-variant-numeric:tabular-nums}
.qtools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}
.sec{color:var(--mut);font-size:14px}.qn{font-size:22px;font-weight:800;color:var(--or);margin:2px 0 6px}
.qt{font-size:18px;margin-bottom:8px;overflow-wrap:anywhere}.hint{color:var(--mut);font-size:14px;margin:8px 0 12px;font-style:italic}
.qi{max-width:100%;height:auto;border-radius:10px;margin:6px 0;background:#fff;display:block}
.opt{display:flex;align-items:center;gap:12px;padding:12px;margin:10px 0;border-radius:14px;border:2px solid var(--bd);background:var(--c2);cursor:pointer;min-height:54px;overflow-wrap:anywhere}
.opt .lt{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;font-weight:700}
.opt .tx{flex:1}.opt .x{flex:none;color:var(--mut);padding:4px 8px;font-size:14px}
.opt.sel{background:var(--orbg);border-color:var(--or)}.opt.sel .lt{background:var(--or);border-color:var(--or);color:#2a1a00}
.opt.ok{background:rgba(46,204,113,.16);border-color:var(--ok)}.opt.ok .lt{background:var(--ok);border-color:var(--ok);color:#06210f}
.opt.bad{background:rgba(255,92,92,.16);border-color:var(--bad)}.opt.bad .lt{background:var(--bad);border-color:var(--bad);color:#2a0606}
.opt.el .tx{text-decoration:line-through;opacity:.4}.opt.el{opacity:.6}
.tf{display:flex;align-items:center;gap:10px;padding:12px;margin:10px 0;border-radius:14px;border:2px solid var(--bd);background:var(--c2);flex-wrap:wrap}
.tf.ok{border-color:var(--ok)}.tf.bad{border-color:var(--bad)}.tf .tx{flex:1 1 220px;overflow-wrap:anywhere}.tf .bt{display:flex;gap:8px}
.tb{padding:10px 16px;min-width:74px;border-radius:12px;border:2px solid var(--bd);background:var(--card);font-weight:700}
.tb.sel{background:var(--orbg);border-color:var(--or);color:var(--or)}.tb.ok{border-color:var(--ok);background:rgba(46,204,113,.2);color:var(--ok)}
.sh{font-size:22px;text-align:center;letter-spacing:1px}
.expl,.note{margin-top:14px;padding:12px;border-radius:14px;background:var(--c2);border:1px solid var(--bd)}
.expl{border-left:4px solid var(--or)}.note textarea{width:100%;margin-top:6px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.qbar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#141416;border-top:1px solid var(--bd);display:flex;align-items:center;gap:8px;z-index:20}
.qbar .sp{flex:1}.nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);font-size:22px}.cnt{font-weight:700;white-space:nowrap}
.qbar .pri{width:auto;padding:12px 22px;font-size:17px;border-radius:14px}
.score{font-size:56px;font-weight:800;color:var(--or)}.score small{font-size:22px;color:var(--mut)}
.res{text-align:center}.res .quick{justify-content:center;margin-top:12px}.res .big{margin-top:8px}
.bar{height:8px;background:var(--c2);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--bad)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);max-width:92vw;padding:13px 18px;border-radius:14px;background:#333;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:60;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.ok{background:linear-gradient(90deg,#2ecc71,#ff9f1c);color:#1c1200}#toast.bad{background:#c0392b}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:70;padding:16px}#modal[hidden],#padWrap[hidden]{display:none}
.mbox{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;max-width:440px;width:100%;max-height:85vh;overflow:auto}
.mbtn{display:flex;gap:10px;margin-top:14px}.mbtn button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);font-weight:700}.mbtn .go{background:var(--or);color:#2a1a00;border:0}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:10px}
.pal button{height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--c2);font-weight:700}.pal .dn{background:var(--orbg);border-color:var(--or)}.pal .cu{outline:2px solid #fff}.pal .fg::after{content:"⚑";color:var(--or);font-size:11px}
#padWrap{position:fixed;inset:0;z-index:50}#pad{width:100%;height:100%;touch-action:none;background:rgba(0,0,0,.25);cursor:crosshair}
#padBar{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#111;padding:6px;border-radius:14px;border:1px solid var(--bd)}
#padBar button{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--c2)}
#nht{position:fixed;right:14px;bottom:10px;font-weight:900;font-size:24px;letter-spacing:3px;color:var(--or);opacity:.9;pointer-events:none;z-index:15}body.inq #nht{bottom:78px;font-size:15px;opacity:.5}
#crash{position:fixed;inset:0;background:#1a1a1d;z-index:99;padding:24px;overflow:auto}#crash pre{white-space:pre-wrap;background:var(--c2);padding:12px;border-radius:12px;color:var(--bad)}
@media(max-width:520px){.qt{font-size:17px}.big{font-size:17px}}
</style>
</head>

// ---------------- StorageEngine: IndexedDB + RAM cache (+ fallback LocalStorage) ----------------
const Store = (() => {
  const ram = {}, pend = new Set(), PFX = 'nhtquiz:';
  let db = null, lsMode = false, timer = 0;
  function lsWrite(k) { try { if (k in ram) localStorage.setItem(PFX + k, JSON.stringify(ram[k])); else localStorage.removeItem(PFX + k); } catch (_) { } }
  function lsLoad() { try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(PFX) === 0) { try { ram[k.slice(PFX.length)] = JSON.parse(localStorage.getItem(k)); } catch (_) { } } } } catch (_) { } }
  function init() {
    return new Promise(res => {
      let done = false;
      const fin = () => { if (!done) { done = true; res(); } };
      const fall = () => { lsMode = true; lsLoad(); fin(); };
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (_) { }
      if (!window.indexedDB) return fall();
      try {
        const rq = indexedDB.open('nht_quiz_db', 1);
        rq.onupgradeneeded = () => { rq.result.createObjectStore('kv'); };
        rq.onsuccess = () => {
          db = rq.result;
          try {
            const tx = db.transaction('kv', 'readonly'), cur = tx.objectStore('kv').openCursor();
            cur.onsuccess = () => { const c = cur.result; if (c) { ram[c.key] = c.value; c.continue(); } };
            tx.oncomplete = fin; tx.onerror = fall;
          } catch (_) { fall(); }
        };
        rq.onerror = fall; rq.onblocked = fall;
        setTimeout(() => { if (!done) { db = null; fall(); } }, 3000);
      } catch (_) { fall(); }
    });
  }
  function flush() {
    timer = 0;
    const ks = Array.from(pend); pend.clear();
    if (!db || !ks.length) return;
    try {
      const tx = db.transaction('kv', 'readwrite'), os = tx.objectStore('kv');
      ks.forEach(k => { if (k in ram) os.put(ram[k], k); else os.delete(k); });
      tx.onerror = () => ks.forEach(lsWrite);
    } catch (_) { ks.forEach(lsWrite); }
  }
  function mark(k) { if (lsMode || !db) { lsWrite(k); return; } pend.add(k); if (!timer) timer = setTimeout(flush, 30); }
  return {
    init, flush,
    get: k => ram[k],
    set: (k, v) => { ram[k] = v; mark(k); },
    del: k => { delete ram[k]; mark(k); },
    keys: p => Object.keys(ram).filter(k => k.indexOf(p) === 0)
  };
})();

}

function stopLive() { if (es) { try { es.close(); } catch (_) { } es = null; } clearInterval(poll); poll = 0; }

// ---------------- Nháp ----------------
const pad = { on: false, col: '#ffd166', er: false, dr: false, x: 0, y: 0 };
function padClear() { const cv = $('#pad'); if (cv) cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }
function padToggle() { pad.on = !pad.on; $('#padWrap').hidden = !pad.on; if (pad.on) { const cv = $('#pad'); if (cv.width !== window.innerWidth || cv.height !== window.innerHeight) { cv.width = window.innerWidth; cv.height = window.innerHeight; } } }
function padInit() {
  const cv = $('#pad');
  cv.addEventListener('pointerdown', ev => { pad.dr = true; pad.x = ev.offsetX; pad.y = ev.offsetY; try { cv.setPointerCapture(ev.pointerId); } catch (_) { } });
  cv.addEventListener('pointermove', ev => {
    if (!pad.dr) return;
    const c = cv.getContext('2d');
    c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = pad.er ? 28 : 3; c.globalCompositeOperation = pad.er ? 'destination-out' : 'source-over'; c.strokeStyle = pad.col;
    c.beginPath(); c.moveTo(pad.x, pad.y); c.lineTo(ev.offsetX, ev.offsetY); c.stroke(); pad.x = ev.offsetX; pad.y = ev.offsetY;
  });
  const end = () => { pad.dr = false; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}

// ---------------- Sao lưu ----------------
function doExport() {
  const data = { app: 'nht-quiz', v: 1, t: Date.now(), hist: hist(), notes: Store.get('notes') || {}, flags: Store.get('flags') || {}, user: Store.get('user') || '', lb: lbLocal() };
  const b = new Blob([JSON.stringify(data)], { type: 'application/json' }), u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = 'nht-quiz-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
  toast('Đã xuất file sao lưu', 'ok');
}
function doImport(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || d.app !== 'nht-quiz' || !Array.isArray(d.hist)) throw new Error('Sai định dạng');
      let c = 0;
      d.hist.forEach(r => { if (r && r.id && r.items && !Store.get(r.id)) { Store.set(r.id, r); c++; } });
      Store.set('notes', Object.assign({}, d.notes || {}, Store.get('notes') || {}));
      const fl = Store.get('flags') || {}; Object.keys(d.flags || {}).forEach(k => { if (!fl[k]) fl[k] = d.flags[k]; }); Store.set('flags', fl);
      if (d.user && !Store.get('user')) Store.set('user', d.user);
      if (Array.isArray(d.lb) && !ONLINE && !lbLocal().length) Store.set('lb', d.lb);
      wc = null; toast('Đã nhập ' + c + ' lượt làm bài mới', 'ok'); render();
    } catch (e) { toast('File sao lưu không hợp lệ: ' + e.message, 'bad'); }
  };
  rd.readAsText(file);
}

// ---------------- Sự kiện (ủy quyền, gắn đúng 1 lần) ----------------
function onClick(ev) {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, a = t.dataset.a;
  switch (act) {
    case 'tab': setView(a); break;
    case 'mode': prefs.mode = a; savePrefs(); render(); break;
    case 'toggleDe': { const ks = ALLK.filter(k => LM[k].exam === +a), all = ks.every(k => prefs.sel.indexOf(k) >= 0); prefs.sel = prefs.sel.filter(k => ks.indexOf(k) < 0); if (!all) prefs.sel = prefs.sel.concat(ks); savePrefs(); render(); break; }
    case 'start': startHome(); break;
    case 'resume': resume(); break;
    case 'qs': guardStart(() => startSession(flagIds('s'), 'Câu hay', 'Câu hay', prefs.mode)); break;
    case 'qd': guardStart(() => startSession(flagIds('d'), 'Câu phân vân', 'Câu phân vân', prefs.mode)); break;
    case 'qw': guardStart(() => startSession(wrongIds(), 'Câu hay sai', 'Câu hay sai', 'practice')); break;
    case 'retryw': { const r = Store.get(a); if (r) guardStart(() => startSession(r.items.filter(x => x[2] < 1).map(x => x[0]), 'Luyện lại câu sai', 'Câu sai', 'practice')); break; }
    case 'review': st.rv = { id: a, f: 'all' }; setView('review'); break;
    case 'rvf': st.rv.f = a; render(); break;
    case 'delh': confirmBox('Xóa lượt làm bài này?', 'Xóa', () => { Store.del(a); wc = null; render(); }); break;
    case 'export': doExport(); break;
    case 'import': $('#fileIn').click(); break;
    case 'rkf': st.rk.f = a; render(); break;
    case 'pick': if (S) pick(+a); break;
    case 'elim': { ev.stopPropagation(); if (!S) break; const q = cur(), e = S.elim[q.id] || (S.elim[q.id] = []), i = e.indexOf(+a); if (i >= 0) e.splice(i, 1); else e.push(+a); persist(); render(); break; }
    case 'tf': if (S) tfSet(+a, t.dataset.v === '1'); break;
    case 'primary': primary(); break;
    case 'prev': if (S) go(-1); break;
    case 'next': if (S) go(1); break;
    case 'flag': if (S) { setFlag(cur().id, a); render(); } break;
    case 'home': if (S) { persist(); S = null; } st.view = 'home'; render(true); toast('Đã lưu tiến trình - bấm "Tiếp tục bài đang làm dở" để làm tiếp'); break;
    case 'endnow': if (S) askFinish(); break;
    case 'pal': if (S) showModal(palHTML()); break;
    case 'jump': hideModal(); if (S) jump(+a); break;
    case 'mclose': hideModal(); break;
    case 'mok': { const cb = modalCb; hideModal(); if (cb) cb(); break; }
    case 'pad': padToggle(); break;
    case 'pcol': pad.col = a; pad.er = false; break;
    case 'per': pad.er = !pad.er; break;
    case 'pclr': padClear(); break;
    default: break;
  }
}
function onChange(ev) {
  const t = ev.target, c = t.dataset && t.dataset.chg; if (!c) return;
  if (c === 'shuffle') { prefs.shuffle = t.checked; savePrefs(); render(); }
  else if (c === 'lesson') { const k = t.dataset.k; prefs.sel = prefs.sel.filter(x => x !== k); if (t.checked) prefs.sel.push(k); savePrefs(); render(); }
  else if (c === 'type') { prefs.types[t.dataset.k] = t.checked; savePrefs(); render(); }
  else if (c === 'rkscope') { st.rk.scope = t.value; loadRank(); }
}
function onInput(ev) {
  const t = ev.target;
  if (t.id === 'userIn') Store.set('user', t.value.trim());
  else if (t.id === 'minsIn') { prefs.mins = Math.max(1, Math.min(300, parseInt(t.value, 10) || 45)); savePrefs(); }
  else if (t.id === 'shortIn' && S) {
    const q = cur(); S.ans[q.id] = t.value; persist();
    const b = $('#priBtn'), r = S.res[q.id];
    if (b && S.mode === 'practice' && !(r && r.checked)) b.disabled = !t.value.trim();
    const s = $('#stat'); if (s) s.textContent = 'Câu ' + (S.pos + 1) + ' - ' + (t.value.trim() ? 'Đã nhập' : 'Chưa nhập');
  } else if (t.id === 'noteIn' && S) { const n = Store.get('notes') || {}; n[cur().id] = t.value; Store.set('notes', n); }
}
function onKey(ev) {
  if (st.view !== 'quiz' || !S || !$('#modal').hidden || pad.on || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const tg = ev.target, tn = tg && tg.tagName;
  if (tn === 'INPUT' || tn === 'TEXTAREA') { if (tg.id === 'shortIn' && ev.key === 'Enter') { ev.preventDefault(); primary(); } return; }
  const k = ev.key.toLowerCase(), q = cur(), it = S.items[S.pos];
  if (q.type === 'single' && /^[1-4a-d]$/.test(k)) { const d = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k); if (d < it.p.length) pick(it.p[d]); ev.preventDefault(); return; }
  if (k === 'enter' || k === ' ') { ev.preventDefault(); primary(); }
  else if (k === 'arrowright') go(1);
  else if (k === 'arrowleft') go(-1);
}
function tick() {
  const now = Date.now(), d = now - lastT; lastT = now;
  if (st.view !== 'quiz' || !S || document.hidden) return;
  S.elapsed += Math.min(d, 2000);
  const el = $('#tm'); if (el) el.textContent = (S.mode === 'exam' ? '⏳ ' : '⏱ ') + fmtT(S.mode === 'exam' ? Math.max(0, S.limit - S.elapsed) : S.elapsed);
  if (S.mode === 'exam' && S.elapsed >= S.limit) { toast('⏰ Hết giờ! Tự động nộp bài', 'bad'); finish(); return; }
  if (++saveN % 10 === 0) persist();
}
function persistAll() { if (S && st.view === 'quiz') persist(); Store.flush(); }

async function boot() {
  try { await Store.init(); } catch (_) { }
  const p = Store.get('prefs') || {};
  prefs = Object.assign(prefs, p);
  prefs.sel = (Array.isArray(prefs.sel) ? prefs.sel : ALLK).filter(k => LM[k]);
  prefs.types = Object.assign({ single: true, truefalse: true, short: true }, prefs.types || {});
  try {
    const ls = JSON.parse(localStorage.getItem('nht_session') || 'null'), ss = Store.get('session');
    if (ls && ls.items && (!ss || (ls.saved || 0) > (ss.saved || 0))) Store.set('session', ls);
  } catch (_) { }
  padInit();
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', onKey);
  document.addEventListener('contextmenu', ev => { const o = ev.target.closest && ev.target.closest('.opt[data-act="pick"]'); if (o && S && st.view === 'quiz') { ev.preventDefault(); const q = cur(), e = S.elim[q.id] || (S.elim[q.id] = []), v = +o.dataset.a, i = e.indexOf(v); if (i >= 0) e.splice(i, 1); else e.push(v); persist(); render(); } });
  $('#fileIn').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; if (f) doImport(f); ev.target.value = ''; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) persistAll(); });
  window.addEventListener('pagehide', persistAll);
  window.addEventListener('beforeunload', persistAll);
  window.addEventListener('load', mathRender);
  setInterval(tick, 500);
  render(true);
  const ss = Store.get('session');
  if (ss && ss.items && ss.items.length) confirmBox('Bạn có bài đang làm dở (đang ở Câu ' + (ss.pos + 1) + '/' + ss.items.length + '). Làm tiếp ngay?', '▶️ Tiếp tục', resume, 'Để sau');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
